<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
        <title id="pipeline-title">The v2 pipeline: two models, one corrected backtest</title>
        <desc id="pipeline-desc">Frozen KEEN prices feed two models, the price-level model and the returns-based model, which run through the same walk-forward fit, trade simulator, seed averaging and statistics to answer the pre-registered questions.</desc>
        <defs>
      <style>#pipeline-root { font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #374151; }
      #pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#pipeline-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6B7280"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- Arrows first -->
        <g fill="none" stroke="#6B7280" stroke-width="1.2">
          <path d="M184,112 H194 Q202,112 202,104 V84 Q202,76 210,76 H218" marker-end="url(#pipeline-arrow)"/>
          <path d="M184,136 H194 Q202,136 202,144 V164 Q202,172 210,172 H218" marker-end="url(#pipeline-arrow)"/>
          <path d="M396,76 H406 Q414,76 414,84 V96 Q414,104 422,104 H430" marker-end="url(#pipeline-arrow)"/>
          <path d="M396,172 H406 Q414,172 414,164 V152 Q414,144 422,144 H430" marker-end="url(#pipeline-arrow)"/>
          <line x1="680" y1="124" x2="714" y2="124" marker-end="url(#pipeline-arrow)"/>
          <line x1="828" y1="176" x2="828" y2="262" marker-end="url(#pipeline-arrow)"/>
          <line x1="716" y1="308" x2="682" y2="308" marker-end="url(#pipeline-arrow)"/>
          <line x1="432" y1="308" x2="398" y2="308" marker-end="url(#pipeline-arrow)"/>
        </g>

        <!-- Arrow label beside the vertical drop: results/ is the boundary between the run and the analysis -->
        <rect x="836" y="196" width="120" height="44" fill="#ffffff"/>
        <text font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="0.06em" fill="#4B5563"><tspan x="840" y="208">RESULTS/</tspan><tspan x="840" y="221">WRITTEN ONCE AT</tspan><tspan x="840" y="234">V2-OFFICIAL-RUN</tspan></text>

        <!-- Nodes -->
        <g font-family="'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
          <!-- Data -->
          <rect x="24" y="88" width="160" height="72" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1"/>
          <rect x="36" y="98" width="40" height="14" rx="2" fill="#F3F4F6"/>
          <text x="56" y="108" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#4B5563">DATA</text>
          <text x="36" y="132" font-size="14" font-weight="600" fill="#374151">KEEN prices</text>
          <text x="36" y="148" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4B5563">frozen, 1,465 rows</text>

          <!-- Price-level model (accent) -->
          <rect x="220" y="40" width="176" height="72" rx="6" fill="#0072b2" stroke="#0072B2" stroke-width="1.4" fill-opacity="0.08"/>
          <rect x="232" y="50" width="46" height="14" rx="2" fill="#0072b2" fill-opacity="0.14"/>
          <text x="255" y="60" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#005A8C">MODEL</text>
          <text x="232" y="84" font-size="14" font-weight="600" fill="#374151">Price-level model</text>
          <text x="232" y="100" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4B5563">raw price levels</text>

          <!-- Returns-based model (accent) -->
          <rect x="220" y="136" width="176" height="72" rx="6" fill="#0072b2" stroke="#0072B2" stroke-width="1.4" fill-opacity="0.08"/>
          <rect x="232" y="146" width="46" height="14" rx="2" fill="#0072b2" fill-opacity="0.14"/>
          <text x="255" y="156" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#005A8C">MODEL</text>
          <text x="232" y="180" font-size="14" font-weight="600" fill="#374151">Returns-based model</text>
          <text x="232" y="196" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4B5563">price ratios to today</text>

          <!-- Walk-forward -->
          <rect x="432" y="60" width="248" height="128" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1"/>
          <rect x="444" y="70" width="84" height="14" rx="2" fill="#F3F4F6"/>
          <text x="486" y="80" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#4B5563">EACH WINDOW</text>
          <text x="444" y="104" font-size="14" font-weight="600" fill="#374151">Walk-forward fit</text>
          <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4B5563">
            <text x="444" y="122">7 windows, 600/120 rows</text>
            <text x="444" y="138">purged before each fit</text>
            <text x="444" y="154">cluster, medoid, MDA top 15</text>
            <text x="444" y="170">XGBoost, v1 settings</text>
          </g>

          <!-- Trade simulator -->
          <rect x="716" y="72" width="224" height="104" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1"/>
          <rect x="728" y="82" width="52" height="14" rx="2" fill="#F3F4F6"/>
          <text x="754" y="92" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#4B5563">TRADES</text>
          <text x="728" y="116" font-size="14" font-weight="600" fill="#374151">Trade simulator</text>
          <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4B5563">
            <text x="728" y="134">long or flat</text>
            <text x="728" y="150">fills at the next close</text>
            <text x="728" y="166">45 / 55 bps per side</text>
          </g>

          <!-- Seed-averaged series -->
          <rect x="716" y="264" width="224" height="88" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1"/>
          <rect x="728" y="274" width="52" height="14" rx="2" fill="#F3F4F6"/>
          <text x="754" y="284" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#4B5563">SERIES</text>
          <text x="728" y="308" font-size="14" font-weight="600" fill="#374151">Seed-averaged series</text>
          <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4B5563">
            <text x="728" y="324">5 selection seeds per model</text>
            <text x="728" y="340">816 out-of-sample days</text>
          </g>

          <!-- Statistics -->
          <rect x="432" y="264" width="248" height="88" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1"/>
          <rect x="444" y="274" width="80" height="14" rx="2" fill="#F3F4F6"/>
          <text x="484" y="284" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#4B5563">STATISTICS</text>
          <text x="444" y="308" font-size="14" font-weight="600" fill="#374151">Excess return, Sharpe</text>
          <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4B5563">
            <text x="444" y="324">vs exposure-matched benchmark</text>
            <text x="444" y="340">block-bootstrap 95% CIs</text>
          </g>

          <!-- Readings -->
          <rect x="24" y="264" width="372" height="88" rx="6" fill="#ffffff" stroke="#374151" stroke-width="1"/>
          <rect x="36" y="274" width="60" height="14" rx="2" fill="#F3F4F6"/>
          <text x="66" y="284" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9" letter-spacing="0.08em" fill="#4B5563">OUTCOME</text>
          <text x="36" y="308" font-size="14" font-weight="600" fill="#374151">Pre-registered questions</text>
          <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10.5" fill="#4B5563">
            <text x="36" y="324">1: does feature form matter?  2: any edge?</text>
            <text x="36" y="340">3: early vs late, descriptive only</text>
          </g>
        </g>

        <!-- Legend strip -->
        <g font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="0.06em" fill="#4B5563">
          <line x1="24" y1="380" x2="936" y2="380" stroke="#E5E7EB" stroke-width="1"/>
          <rect x="24" y="396" width="16" height="12" rx="2" fill="#0072b2" stroke="#0072B2" stroke-width="1.4" fill-opacity="0.08"/>
          <text x="48" y="406">THE TWO MODELS COMPARED: SAME STEPS, DIFFERENT FEATURE FORM</text>
          <rect x="560" y="396" width="16" height="12" rx="2" fill="#ffffff" stroke="#374151" stroke-width="1"/>
          <text x="584" y="406">SHARED STEP</text>
        </g>
      </svg>
